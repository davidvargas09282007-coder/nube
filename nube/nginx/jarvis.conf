# ============================================================================
# nginx de referencia para un VPS (TLS con certbot o certificado propio).
# Copia a /etc/nginx/sites-available/jarvis y enlaza en sites-enabled.
# Sustituye jarvis.example.com y las rutas del certificado.
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jarvis_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jarvis.example.com;

    # Deja pasar el desafio de certbot y redirige el resto.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jarvis.example.com;

    ssl_certificate     /etc/letsencrypt/live/jarvis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Audio PCM16: deja margen suficiente.
    client_max_body_size 8m;

    location / {
        proxy_pass http://jarvis_backend;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sesiones de voz largas: no cortar por inactividad.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Healthcheck publico (sin token).
    location = /health {
        proxy_pass http://jarvis_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
